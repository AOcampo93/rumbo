<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1E4FA3}a:hover{color:#183F82}</style>
</helmet>
<div style="position:relative;width:100%;height:100%;overflow:hidden;background:var(--r-bg,#F7F3EC);color:var(--r-text,#16191D);font-family:Inter, system-ui, sans-serif;display:flex;flex-direction:column">
  <div style="flex:none;height:180px;background:radial-gradient(circle at 0 0, #F7F3EC 0 7px, transparent 8px) 0 0/40px 40px, radial-gradient(circle at 100% 0, #F7F3EC 0 7px, transparent 8px) 0 0/40px 40px, radial-gradient(circle at 0 100%, #F7F3EC 0 7px, transparent 8px) 0 0/40px 40px, radial-gradient(circle at 100% 100%, #F7F3EC 0 7px, transparent 8px) 0 0/40px 40px, radial-gradient(circle, transparent 0 8px, #F7F3EC 8px 10px, transparent 10px) 0 0/40px 40px, conic-gradient(from 45deg, #1E4FA3 0 25%, #183F82 0 50%, #1E4FA3 0 75%, #183F82 0) 0 0/40px 40px;position:relative">
    <div style="position:absolute;left:16px;bottom:-28px;width:56px;height:56px;border-radius:16px;background:var(--r-surface,#FFFFFF);box-shadow:0 6px 18px rgba(22,25,29,.16);display:flex;align-items:center;justify-content:center"><dc-import name="Icon" icon="languages" size="28" color="var(--r-primary,#1E4FA3)" hint-size="28px,28px"></dc-import></div>
  </div>
  <div style="flex:1;overflow-y:auto;padding:48px 16px 24px;display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="font-family:Fraunces, Georgia, serif;font-weight:600;font-size:30px;line-height:36px;letter-spacing:-0.01em">{{ t.title }}</div>
      <div style="font:400 16px/24px Inter, sans-serif;color:var(--r-muted,#5B6470)">{{ t.others }}</div>
    </div>
    <div role="radiogroup" style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{ langs }}" as="l" hint-placeholder-count="3">
        <button role="radio" aria-checked="{{ l.on }}" onClick="{{ l.pick }}" style="min-height:72px;padding:12px 16px;border-radius:14px;border-width:2px;border-style:solid;border-color:{{ l.border }};background:{{ l.bg }};color:var(--r-text,#16191D);display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer">
          <span style="width:44px;height:44px;flex:none;border-radius:50%;background:{{ l.codeBg }};color:{{ l.codeFg }};display:flex;align-items:center;justify-content:center;font:700 15px Inter, sans-serif;letter-spacing:.04em">{{ l.code }}</span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column">
            <span style="font:600 17px/22px Inter, sans-serif">{{ l.native }}</span>
            <span style="font:400 14px/20px Inter, sans-serif;color:var(--r-muted,#5B6470)">{{ l.local }}</span>
          </span>
          <span style="width:24px;height:24px;flex:none;border-radius:50%;box-sizing:border-box;border-width:2px;border-style:solid;border-color:{{ l.dot }};background:{{ l.dotFill }};display:flex;align-items:center;justify-content:center">
            <sc-if value="{{ l.on }}" hint-placeholder-val="{{ false }}"><dc-import name="Icon" icon="check" size="14" color="var(--r-on-primary,#FFFFFF)" stroke="3" hint-size="14px,14px"></dc-import></sc-if>
          </span>
        </button>
      </sc-for>
    </div>
    <div style="display:flex;align-items:center;gap:8px;font:400 14px/20px Inter, sans-serif;color:var(--r-muted,#5B6470)"><dc-import name="Icon" icon="settings" size="16" color="var(--r-muted,#5B6470)" hint-size="16px,16px"></dc-import>{{ t.hint }}</div>
  </div>
  <div style="flex:none;padding:12px 16px 30px;background:var(--r-surface,#FFFFFF);border-top:1px solid var(--r-border,#E2DACB)">
    <button onClick="{{ go }}" style="width:100%;height:56px;border:none;border-radius:999px;background:var(--r-primary,#1E4FA3);color:var(--r-on-primary,#FFFFFF);font:600 17px Inter, sans-serif;cursor:pointer">{{ t.cta }}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;es&quot;,&quot;en&quot;,&quot;pt&quot;],&quot;default&quot;:&quot;es&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onDone&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(lang: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { lang: this.props.lang || 'es' };
  renderVals() {
    const p = this.props, cur = this.state.lang;
    const T = {
      es: { title: 'Elige tu idioma', others: 'Choose your language · Escolhe o teu idioma', hint: 'Puedes cambiarlo después en Ajustes.', cta: 'Continuar', names: { es: 'Español', en: 'Inglés', pt: 'Portugués' } },
      en: { title: 'Choose your language', others: 'Elige tu idioma · Escolhe o teu idioma', hint: 'You can change it later in Settings.', cta: 'Continue', names: { es: 'Spanish', en: 'English', pt: 'Portuguese' } },
      pt: { title: 'Escolhe o teu idioma', others: 'Elige tu idioma · Choose your language', hint: 'Podes alterá-lo depois nas Definições.', cta: 'Continuar', names: { es: 'Espanhol', en: 'Inglês', pt: 'Português' } }
    };
    const t = T[cur];
    const langs = [['es', 'ES', 'Español'], ['en', 'EN', 'English'], ['pt', 'PT', 'Português']].map(([id, code, native]) => {
      const on = id === cur;
      return {
        code, native, local: t.names[id], on,
        border: on ? 'var(--r-primary,#1E4FA3)' : 'var(--r-border,#E2DACB)', bg: 'var(--r-surface,#FFFFFF)',
        codeBg: on ? 'var(--r-primary,#1E4FA3)' : 'var(--r-surface2,#EFE9DE)', codeFg: on ? 'var(--r-on-primary,#FFFFFF)' : 'var(--r-text,#16191D)',
        dot: on ? 'var(--r-primary,#1E4FA3)' : 'var(--r-border,#E2DACB)', dotFill: on ? 'var(--r-primary,#1E4FA3)' : 'transparent',
        pick: () => this.setState({ lang: id })
      };
    });
    return { t, langs, go: () => p.onDone && p.onDone(cur) };
  }
}
</script>
</body>
</html>
