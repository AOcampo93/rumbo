<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#1E4FA3}a:hover{color:#183F82}</style>
</helmet>
<div style="position:relative;width:100%;height:100%;overflow:hidden;background:var(--r-surface,#FFFFFF);color:var(--r-text,#16191D);font-family:Inter, system-ui, sans-serif">
  <div style="position:absolute;left:0;right:0;top:0;height:400px;overflow:hidden">
    <dc-import name="MapBase" base="{{ base }}" z="15" w="390" h="400" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import>
    <svg width="390" height="400" style="position:absolute;left:0;top:0;pointer-events:none">
      <polyline points="{{ pathPts }}" style="fill:none;stroke:#0B7A75;stroke-width:4px;stroke-dasharray:8 6;stroke-opacity:.8;stroke-linecap:round;stroke-linejoin:round"></polyline>
    </svg>
    <sc-for list="{{ mapPts }}" as="m" hint-placeholder-count="0">
      <dc-import name="Marker" kind="{{ m.kind }}" cat="{{ m.cat }}" order="{{ m.order }}" scale="0.85" style="position:absolute;left:{{ m.x }}px;top:{{ m.y }}px" hint-size="0px,0px"></dc-import>
    </sc-for>
    <button onClick="{{ back }}" aria-label="Atrás" style="position:absolute;left:16px;top:54px;width:48px;height:48px;border-radius:50%;border:none;background:var(--r-surface,#FFFFFF);color:var(--r-text,#16191D);box-shadow:0 6px 18px rgba(22,25,29,.12);display:flex;align-items:center;justify-content:center;cursor:pointer"><dc-import name="Icon" icon="arrow-left" size="22" hint-size="22px,22px"></dc-import></button>
    <button aria-label="Mapa a pantalla completa" style="position:absolute;right:16px;top:54px;width:48px;height:48px;border-radius:50%;border:none;background:var(--r-surface,#FFFFFF);color:var(--r-text,#16191D);box-shadow:0 6px 18px rgba(22,25,29,.12);display:flex;align-items:center;justify-content:center;cursor:pointer"><dc-import name="Icon" icon="maximize-2" size="20" hint-size="20px,20px"></dc-import></button>
    <div style="position:absolute;right:8px;bottom:26px;font:600 10px Inter, sans-serif;color:#3D444D;background:rgba(255,255,255,.75);padding:1px 6px;border-radius:4px">Powered by Esri</div>
  </div>
  <div style="position:absolute;left:0;right:0;top:380px;bottom:0;background:var(--r-surface,#FFFFFF);border-radius:20px 20px 0 0;box-shadow:0 -4px 16px rgba(22,25,29,.08);display:flex;flex-direction:column">
    <div style="flex:none;display:flex;justify-content:center;padding:8px 0 4px"><div style="width:36px;height:5px;border-radius:3px;background:var(--r-border,#E2DACB)"></div></div>
    <div style="flex:1;overflow-y:auto;padding:8px 16px 140px;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="font-family:Fraunces, Georgia, serif;font-weight:600;font-size:26px;line-height:32px;letter-spacing:-0.01em">{{ r.name }}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <div style="height:28px;padding:0 10px 0 8px;border-radius:6px;background:{{ r.badgeBg }};color:{{ r.badgeFg }};display:flex;align-items:center;gap:5px;font:700 13px Inter, sans-serif"><dc-import name="Icon" icon="{{ r.badgeIcon }}" size="15" color="{{ r.badgeFg }}" hint-size="15px,15px"></dc-import>{{ r.modeLabel }}</div>
          <div style="height:28px;padding:0 10px 0 8px;border-radius:6px;background:var(--r-surface2,#EFE9DE);display:flex;align-items:center;gap:5px;font:700 13px Inter, sans-serif"><dc-import name="Icon" icon="{{ r.actIcon }}" size="15" hint-size="15px,15px"></dc-import>{{ r.act }}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <sc-for list="{{ r.stats }}" as="s" hint-placeholder-count="3">
          <div style="height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--r-border,#E2DACB);display:flex;align-items:center;gap:6px;font:600 14px Inter, sans-serif;font-variant-numeric:tabular-nums"><dc-import name="Icon" icon="{{ s.icon }}" size="16" color="var(--r-muted,#5B6470)" hint-size="16px,16px"></dc-import>{{ s.v }}</div>
        </sc-for>
      </div>
      <sc-if value="{{ isChal }}" hint-placeholder-val="{{ false }}">
        <div style="padding:14px;border-radius:14px;background:var(--r-chal-soft,#F6D3C4);color:var(--r-text,#16191D);display:flex;gap:12px;align-items:flex-start">
          <dc-import name="Icon" icon="flag" size="22" color="var(--r-chal-text,#A33A12)" hint-size="22px,22px"></dc-import>
          <div style="display:flex;flex-direction:column;gap:2px"><div style="font:700 12px/16px Inter, sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--r-chal-text,#A33A12)">Reglas del reto</div><div style="font:600 16px/24px Inter, sans-serif">Orden obligatorio · Límite 1 h 30 · Pasa por los 9 checkpoints</div></div>
        </div>
      </sc-if>
      <div style="font:400 16px/24px Inter, sans-serif;color:var(--r-text,#16191D);text-wrap:pretty">{{ r.desc }} <span style="color:var(--r-primary,#1E4FA3);font-weight:600">Leer más</span></div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:4px">
        <div style="font:700 20px/26px Inter, sans-serif">Puntos de la ruta</div>
        <div style="font:400 14px Inter, sans-serif;color:var(--r-muted,#5B6470)">{{ r.count }}</div>
      </div>
      <div style="display:flex;flex-direction:column">
        <sc-for list="{{ list }}" as="it" hint-placeholder-count="5">
          <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--r-border,#E2DACB)">
            <div style="width:30px;height:30px;flex:none;border-radius:50%;background:{{ it.bubble }};color:#FFFFFF;display:flex;align-items:center;justify-content:center;font:700 13px Inter, sans-serif;font-variant-numeric:tabular-nums">{{ it.order }}</div>
            <div style="width:48px;height:48px;flex:none;border-radius:10px;background:repeating-linear-gradient(135deg, #E9E2D4 0 6px, #EFE9DE 6px 12px)"></div>
            <div style="flex:1;min-width:0">
              <div style="font:600 17px/22px Inter, sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.name }}</div>
              <div style="font:400 14px/20px Inter, sans-serif;color:var(--r-muted,#5B6470);font-variant-numeric:tabular-nums">{{ it.sub }}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 16px 30px;background:var(--r-surface,#FFFFFF);border-top:1px solid var(--r-border,#E2DACB);display:flex;flex-direction:column;gap:8px">
    <button onClick="{{ start }}" style="height:56px;border:none;border-radius:999px;background:var(--r-primary,#1E4FA3);color:var(--r-on-primary,#FFFFFF);font:600 17px Inter, sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer"><dc-import name="Icon" icon="navigation" size="20" color="var(--r-on-primary,#FFFFFF)" hint-size="20px,20px"></dc-import>Iniciar ruta</button>
    <div style="display:flex;align-items:center;justify-content:center;gap:6px;font:600 13px Inter, sans-serif;color:var(--r-success,#1A7F45)"><dc-import name="Icon" icon="circle-check" size="15" color="var(--r-success,#1A7F45)" hint-size="15px,15px"></dc-import>Disponible sin conexión</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;route&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;leiria&quot;,&quot;reto&quot;,&quot;bici&quot;],&quot;default&quot;:&quot;leiria&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onBack&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onStart&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, id = p.route || 'leiria', ch = id === 'reto';
    const CAT = { monument: 'Monumento', church: 'Iglesia', museum: 'Museo', viewpoint: 'Mirador', food: 'Gastronomía', nature: 'Naturaleza', culture: 'Cultura', other: 'Plaza', start: 'Salida', checkpoint: 'Checkpoint', finish: 'Meta' };
    const FREE = [['Praça Rodrigues Lobo', 'other', 0], ['Sé de Leiria', 'church', 350], ['Castelo de Leiria', 'monument', 340], ['Igreja de São Pedro', 'church', 260], ['Museu de Leiria', 'museum', 210], ['m|i|mo – Museu da Imagem em Movimento', 'museum', 300], ['Santuário de N.ª Sr.ª da Encarnação', 'viewpoint', 380], ['Moinho do Papel', 'culture', 290], ['Jardim Luís de Camões', 'nature', 330], ["Mercado de Sant'Ana", 'food', 270], ['Teatro José Lúcio da Silva', 'culture', 400], ['Igreja da Misericórdia', 'church', 220]];
    const CHAL = [["Salida · Mercado de Sant'Ana", 'start', 0], ['Ponte Hintze Ribeiro', 'checkpoint', 620], ['Moinho do Papel', 'checkpoint', 710], ['Ponte dos Caniços', 'checkpoint', 540], ['Parque do Avião', 'checkpoint', 680], ['Jardim da Almuinha', 'checkpoint', 590], ['Ponte da Portela', 'checkpoint', 760], ['Marachão', 'checkpoint', 640], ['Ponte Euro 2004', 'checkpoint', 700], ['Meta · Estádio Municipal', 'finish', 560]];
    const XY = [[165, 330], [90, 290], [250, 255], [300, 195], [235, 160], [160, 180], [80, 215], [110, 140], [205, 115], [300, 120], [345, 260], [330, 330]];
    const data = {
      leiria: { name: 'Leiria histórica', modeLabel: 'Libre', badgeBg: 'var(--r-free-soft,#D7ECEA)', badgeFg: 'var(--r-free-text,#0B6B66)', badgeIcon: 'compass', act: 'A pie', actIcon: 'footprints', stats: [{ icon: 'route', v: '3,4 km' }, { icon: 'clock', v: '~2 h' }, { icon: 'map-pin', v: '12 puntos' }], desc: 'Un paseo por el corazón medieval de Leiria: del castillo sobre la colina a las plazas del centro y la orilla del Lis. Cada parada se abre al llegar con su historia y algún reto.', count: '12 · en cualquier orden' },
      bici: { name: 'Leiria en bici', modeLabel: 'Libre', badgeBg: 'var(--r-free-soft,#D7ECEA)', badgeFg: 'var(--r-free-text,#0B6B66)', badgeIcon: 'compass', act: 'Bici', actIcon: 'bike', stats: [{ icon: 'route', v: '11,5 km' }, { icon: 'clock', v: '~1 h 10' }, { icon: 'map-pin', v: '8 puntos' }], desc: 'Parques, molinos y miradores por los carriles bici de la ciudad, con paradas cortas en cada lugar.', count: '8 · en cualquier orden' },
      reto: { name: 'Reto Ribeira do Lis', modeLabel: 'Reto', badgeBg: 'var(--r-chal-soft,#F6D3C4)', badgeFg: 'var(--r-chal-text,#A33A12)', badgeIcon: 'flag', act: 'Correr', actIcon: 'activity', stats: [{ icon: 'route', v: '6,2 km' }, { icon: 'clock', v: '~45 min' }, { icon: 'flag', v: '10 puntos' }, { icon: 'timer', v: 'Límite 1 h 30' }], desc: 'Carrera junto al río Lis desde el Mercado de Sant\'Ana hasta el estadio, cruzando sus puentes. Pasa por los checkpoints en orden antes de que acabe el tiempo.', count: '9 checkpoints + meta' }
    };
    const r = data[id] || data.leiria;
    let P = ch ? CHAL : FREE; if (id === 'bici') P = FREE.slice(0, 8);
    const mapPts = P.map((q, i) => ({ x: XY[i][0], y: XY[i][1], cat: q[1], order: String(i + 1), kind: q[1] === 'finish' ? 'finish' : 'active' }));
    const list = P.map((q, i) => ({ order: String(i + 1), name: q[0], bubble: q[1] === 'finish' ? '#16191D' : ch ? '#C4491F' : '#1E4FA3', sub: CAT[q[1]] + ' · ' + (i === 0 ? 'Inicio' : (q[2] >= 1000 ? (q[2] / 1000).toFixed(1).replace('.', ',') + ' km' : q[2] + ' m') + ' desde el anterior') }));
    return { r, isChal: ch, base: ch ? 'topo' : 'streets', mapPts, list, pathPts: P.map((_, i) => XY[i].join(',')).join(' '), back: () => p.onBack && p.onBack(), start: () => p.onStart && p.onStart() };
  }
}
</script>
</body>
</html>
